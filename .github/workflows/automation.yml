
name: Daily UID Automation

on:
  schedule:
    # Every 10 minutes (UTC)
    - cron: '*/10 * * * *'

  # Allow manual testing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-uid-automation
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    steps:

      # Checkout Python application
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app

      # Checkout persistent storage branch
      - name: Checkout persistent records
        uses: actions/checkout@v4
        with:
          ref: automation-data
          path: data

      # Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install dependencies
      - name: Install requirements
        working-directory: app
        run: |
          pip install -r requirements.txt

      # Execute controller
      - name: Process pending UIDs
        run: |
          python app/main.py --state-file data/success_records.json
        env:
          COUPON: ${{ secrets.COUPON }}
          API_URL: https://bnsgaming.site/api/send.php

      # Save persistent records
      - name: Commit updated records
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add success_records.json

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update daily UID success records"
            git push origin HEAD:automation-data
          fi
